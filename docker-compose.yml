version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: plaur
      POSTGRES_USER: plaur
      POSTGRES_PASSWORD: plaur
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  plaur-auth:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PLAUR_SERVICE_TYPE: auth-service
      PLAUR_ENV: development
      PLAUR__DATABASE__URL: postgresql://plaur:plaur@postgres:5432/plaur
      PLAUR__REDIS__URL: redis://redis:6379
    ports:
      - "8081:8080"
    depends_on:
      - postgres
      - redis

  plaur-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PLAUR_SERVICE_TYPE: api-gateway
      PLAUR_ENV: development
    ports:
      - "8080:8080"
    depends_on:
      - plaur-auth

  plaur-ingestion:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PLAUR_SERVICE_TYPE: ingestion-service
      PLAUR_ENV: development
      PLAUR__DATABASE__URL: postgresql://plaur:plaur@postgres:5432/plaur
      PLAUR__REDIS__URL: redis://redis:6379
    ports:
      - "8082:8080"
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
  qdrant_data: