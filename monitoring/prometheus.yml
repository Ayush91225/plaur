global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "plaur_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'plaur-auth'
    static_configs:
      - targets: ['plaur-auth:8080']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'plaur-api'
    static_configs:
      - targets: ['plaur-api:8080']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'plaur-ingestion'
    static_configs:
      - targets: ['plaur-ingestion:8080']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'plaur-analytics'
    static_configs:
      - targets: ['plaur-analytics:8080']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'plaur-ai'
    static_configs:
      - targets: ['plaur-ai:8080']
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']