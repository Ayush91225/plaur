apiVersion: apps/v1
kind: Deployment
metadata:
  name: plaur-auth
  namespace: plaur
  labels:
    app: plaur-auth
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: plaur-auth
  template:
    metadata:
      labels:
        app: plaur-auth
        version: v1
    spec:
      containers:
      - name: plaur-auth
        image: plaur/auth:latest
        ports:
        - containerPort: 8080
        env:
        - name: PLAUR_SERVICE_TYPE
          value: "auth-service"
        - name: PLAUR_ENV
          value: "production"
        - name: PLAUR__DATABASE__URL
          valueFrom:
            secretKeyRef:
              name: plaur-secrets
              key: database-url
        - name: PLAUR__REDIS__URL
          valueFrom:
            secretKeyRef:
              name: plaur-secrets
              key: redis-url
        - name: PLAUR__SECURITY__JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: plaur-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: plaur-auth-service
  namespace: plaur
  labels:
    app: plaur-auth
spec:
  selector:
    app: plaur-auth
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
  type: ClusterIP