apiVersion: v1
kind: Namespace
metadata:
  name: plaur
  labels:
    name: plaur
---
apiVersion: v1
kind: Secret
metadata:
  name: plaur-secrets
  namespace: plaur
type: Opaque
data:
  database-url: cG9zdGdyZXNxbDovL3BsYXVyOnBsYXVyQHBvc3RncmVzOjU0MzIvcGxhdXI=  # base64 encoded
  redis-url: cmVkaXM6Ly9yZWRpczozNjM3OQ==  # base64 encoded
  jwt-secret: eW91ci1qd3Qtc2VjcmV0LWtleQ==  # base64 encoded
  shopify-app-secret: eW91ci1zaG9waWZ5LWFwcC1zZWNyZXQ=  # base64 encoded
  openai-api-key: eW91ci1vcGVuYWktYXBpLWtleQ==  # base64 encoded
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: plaur-config
  namespace: plaur
data:
  config.yaml: |
    server:
      host: "0.0.0.0"
      port: 8080
      workers: 4
    aws:
      region: "us-east-1"
      s3_bucket: "plaur-data"
    shopify:
      scopes:
        - "read_products"
        - "read_orders"
        - "read_customers"
        - "read_inventory"
    billing:
      shopify_billing_api_version: "2023-10"
      trial_days: 14